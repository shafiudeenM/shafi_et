name: Android Cloud Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build
        env:
          VITE_API_URL: "https://shafi-et-sir4.onrender.com"
          VITE_SUPABASE_URL: "https://dchqmhxcggjtymctvbxe.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjaHFtaHhjZ2dqdHltY3R2YnhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMzU4ODYsImV4cCI6MjEwMjkxMTg4Nn0.u7-Q0fJGb74RgMs5cggIDvPqdEpP-Xy8EEsum0VWLe8"
          VITE_SENTRY_DSN: "https://84fc088fce949f9e692f5bc38514a169@o4512023634247680.ingest.de.sentry.io/4512023641194576"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK (Debug)
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ./android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

