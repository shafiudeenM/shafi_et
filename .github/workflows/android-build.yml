name: Android Cloud Build

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Using Node 20 LTS

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Android requires Java 17

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build
        env:
          # We provide dummy values here just so Vite can build successfully if it strictly requires them.
          VITE_API_URL: "https://shafi-et-sir4.onrender.com"
          VITE_SUPABASE_URL: "https://dummy.supabase.co"
          VITE_SUPABASE_ANON_KEY: "dummy"
          VITE_SENTRY_DSN: "dummy"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK (Debug)
        run: ./gradlew assembleDebug
        working-directory: ./android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
