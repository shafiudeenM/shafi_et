<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1810" />
      <stop offset="50%" stop-color="#0f0f0f" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d79b" />
      <stop offset="35%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#8d6f30" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#c5a059" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" stroke="#c5a059" stroke-width="6" stroke-opacity="0.4" />

  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#c5a059" stroke-width="2" stroke-opacity="0.18" stroke-dasharray="8 6" />

  <!-- Academic Cap / Pedagogical Emblem -->
  <g filter="url(#glow512)">
    <!-- Mortarboard Top Diamond -->
    <path d="M256 120 L396 185 L256 250 L116 185 Z" fill="url(#goldGrad512)" />
    
    <!-- Cap Skull Base -->
    <path d="M165 218 L165 288 C165 330, 347 330, 347 288 L347 218" fill="none" stroke="url(#goldGrad512)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Tassel Ribbon & Drop -->
    <path d="M375 195 L386 295" fill="none" stroke="#f3d79b" stroke-width="9" stroke-linecap="round" />
    <circle cx="386" cy="308" r="12" fill="#f3d79b" />
  </g>

  <!-- Open Book Base Emblem -->
  <g transform="translate(128, 335)">
    <!-- Left Page -->
    <path d="M128 64 C90 42, 32 48, 6 54 L6 108 C32 102, 90 96, 128 118 Z" fill="none" stroke="url(#goldGrad512)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Page -->
    <path d="M128 64 C166 42, 224 48, 250 54 L250 108 C224 102, 166 96, 128 118 Z" fill="none" stroke="url(#goldGrad512)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Spine -->
    <line x1="128" y1="64" x2="128" y2="118" stroke="#c5a059" stroke-width="9" stroke-linecap="round" />
  </g>
</svg>
