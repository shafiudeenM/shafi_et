<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1811" />
      <stop offset="50%" stop-color="#0e0e0e" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c581" />
      <stop offset="40%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#8d6f30" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#c5a059" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Background Container -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#c5a059" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Inner Subtle Ring -->
  <circle cx="96" cy="96" r="82" fill="none" stroke="#c5a059" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 3" />

  <!-- Academic Cap / Pedagogical Emblem -->
  <g filter="url(#glow)">
    <!-- Mortarboard Top Diamond -->
    <path d="M96 46 L148 70 L96 94 L44 70 Z" fill="url(#goldGrad)" />
    
    <!-- Cap Skull Base -->
    <path d="M62 82 L62 108 C62 124, 130 124, 130 108 L130 82" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Tassel Ribbon & Drop -->
    <path d="M140 73 L144 110" fill="none" stroke="#e5c581" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="144" cy="115" r="4.5" fill="#e5c581" />
  </g>

  <!-- Open Book Base Emblem -->
  <g transform="translate(48, 126)">
    <!-- Left Page -->
    <path d="M48 24 C34 16, 12 18, 2 20 L2 40 C12 38, 34 36, 48 44 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Page -->
    <path d="M48 24 C62 16, 84 18, 94 20 L94 40 C84 38, 62 36, 48 44 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Spine -->
    <line x1="48" y1="24" x2="48" y2="44" stroke="#c5a059" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
